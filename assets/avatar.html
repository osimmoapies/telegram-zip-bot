<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #ava {
    width: 512px; height: 512px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 45%, #2563EB 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }
  #ava::before {
    content: ""; position: absolute; top: -20%; left: -15%; width: 75%; height: 75%;
    background: radial-gradient(circle, rgba(255,255,255,.40), transparent 60%);
  }
  #ava::after {
    content: ""; position: absolute; bottom: -25%; right: -20%; width: 85%; height: 85%;
    background: radial-gradient(circle, rgba(56,189,248,.50), transparent 60%);
  }
  .glass {
    position: absolute; width: 312px; height: 312px; border-radius: 72px;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.28);
    box-shadow: 0 24px 70px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .icon {
    position: relative; font-size: 210px; line-height: 1;
    filter: drop-shadow(0 16px 28px rgba(0,0,0,.32));
  }
</style>
</head>
<body>
  <div id="ava">
    <div class="glass"></div>
    <div class="icon">🧰</div>
  </div>
</body>
</html>
